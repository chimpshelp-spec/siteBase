  <g fill="#FFFFFF">
    <!-- Outer rounded rectangle cut to form an 'E' -->
    <path d="M20 14 L92 14 C96 14 100 18 100 22 L100 98 C100 102 96 106 92 106 L20 106 C16 106 12 102 12 98 L12 22 C12 18 16 14 20 14 Z" />
